<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Thanh Ngoc</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Header -->
    <header class="site-header container">
        <a class="logo" href="#">Trần Thanh Ngọc</a>
        <nav class="site-nav">
            <ul>
                <li><a href="#about">Giới thiệu</a></li>
                <li><a href="#projects">Dự án</a></li>
                <li><a href="#contact">Liên hệ</a></li>
            </ul>
        </nav>
        <!-- Nút chuyển đổi Dark/Light Mode -->
        <button id="theme-toggle" class="button" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">Giao diện</button>
    </header>
    <!-- Main -->
    <main class="container">
        
              <!-- Hero Section -->
        <section id="about" class="hero">
            <div>
                <h1>HI, HAVE A NICE DAY</h1>
                <a class="button" href="#projects">Giới thiệu</a>
                
                <p style="margin-top: 1rem;">
                    Physics Student | HCM VNUHCM - University of Science.
                </p>
<p style="margin-top: 1rem;">
                    📍 TP. Hồ Chí Minh | 
                    📞  0566932962 |
                    ✉️  ngocthanhtran1502@gmail.com
                </p>
                <p 
                    <br>
                    🔗 <a href="https://www.linkedin.com" target="_blank" style="color: var(--color-text); text-decoration: underline;">Thanh Ngoc Tran</a>
                </p>
            </div>
            <img src="me.jpg" alt="Ảnh chân dung Thanh Ngọc">
        </section>

        <!--DỰ ÁN -->
        <section id="projects">
            <h2>Dự án</h2>
            
            <!-- Vùng chứa các nút bấm lọc Tag -->
            <div id="filters"></div>
            
            <!-- Vùng chứa danh sách các dự án sẽ được in ra -->
            <ul id="project-list"></ul>
            
            <!-- Khuôn đúc dự án -->
            <template id="project-card">
              <li class="card">
                <h3></h3>
                <p class="tags"></p>
              </li>
            </template>
        </section>

        <!-- Form liên hệ -->
        <section id="contact">
            <h2>Liên hệ</h2>
            <form>
                <div class="field">
                    <label for="name">Họ tên</label>
                    <input id="name" name="name" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" required>
                </div>
                <div class="field">
                    <label for="msg">Lời nhắn</label>
                    <textarea id="msg" name="msg"></textarea>
                </div>
                <button class="button">Gửi</button>
            </form>
        </section>
        
    </main>

    <!-- Footer -->
    <footer class="container">© 2026 Trần Thanh Ngọc</footer>

    <!-- JavaScript Module -->
    <script type="module" src="app.js"></script>
</body>
</html>
